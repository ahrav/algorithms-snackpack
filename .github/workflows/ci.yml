name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo bench --workspace --no-run
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 topics/028-work-stealing-deques/scripts/test_run_campaign.py
      - run: python3 topics/032-topological-order-and-incremental-dags/scripts/test_run.py
      - run: |
          python3 measurements/test_run.py
          python3 measurements/test_analyze.py
        working-directory: topics/033-tarjan-strongly-connected-components
      - run: python3 topics/034-dominator-trees/measurements/test_run.py
      - run: python3 topics/039-adaptive-string-search/measurements/test_run.py
      - run: python3 measurements/test_run.py
        working-directory: >-
          topics/040-rolling-hashes-and-content-defined-chunking
      - run: python3 measurements/test_run.py
        working-directory: >-
          topics/043-multi-pattern-matching-and-automata
      - run: python3 measurements/test_run.py
        working-directory: >-
          topics/044-varints-codecs-and-bounded-decoding
      - run: python3 measurements/test_run.py
        working-directory: >-
          topics/045-compression-oriented-transforms
      - run: python3 topics/046-streaming-sketches/test_run.py
