<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#f4f7fb"/>
<g font-family="Arial,sans-serif" fill="#152c48">
<text x="38" y="43" font-size="27" font-weight="bold">One event queue, two kinds of repair</text>
<text x="38" y="75" font-size="18">Smaller priority first. Equal priorities use original arrival rank.</text>
<g stroke="#7b8ea6" stroke-width="2" fill="white"><rect x="38" y="103" width="340" height="273" rx="12"/><rect x="430" y="103" width="340" height="273" rx="12"/><rect x="822" y="103" width="340" height="273" rx="12"/></g>
<g font-size="21" font-weight="bold"><text x="58" y="138">BEFORE: valid binary heap</text><text x="450" y="138">DURING: A changes to 1</text><text x="842" y="138">AFTER: repair upward</text></g>
<g font-size="19"><text x="58" y="175">Array slot   Job (priority, arrival)</text><text x="450" y="175">Only A's priority changes</text><text x="842" y="175">Root is earliest live job</text></g>
<g font-family="monospace" font-size="22"><text x="62" y="215">0   B (3, 1)  root</text><text x="62" y="253">1   A (5, 0)</text><text x="62" y="291">2   C (3, 2)</text><text x="62" y="329">3   D (8, 3)</text>
<text x="454" y="215">0   B (3, 1)</text><text x="454" y="253" fill="#a32b22">1   A (1, 0)  ↑</text><text x="454" y="291">2   C (3, 2)</text><text x="454" y="329">3   D (8, 3)</text>
<text x="846" y="215" fill="#126341">0   A (1, 0)  root</text><text x="846" y="253">1   B (3, 1)</text><text x="846" y="291">2   C (3, 2)</text><text x="846" y="329">3   D (8, 3)</text></g>
<g font-size="31"><text x="390" y="248">→</text><text x="782" y="248">→</text></g>
<rect x="38" y="403" width="1124" height="182" rx="12" fill="#e2edf7"/>
<text x="58" y="439" font-size="22" font-weight="bold">LAZY ALTERNATIVE: append a new record, validate before returning</text>
<g font-size="20"><text x="58" y="475">Live A = (priority 1, arrival 0, version 5). The old A record at version 1 is stale.</text><text x="58" y="511">Pop order: A → B → C → D. B precedes C because arrival 1 precedes arrival 2.</text><text x="58" y="547">Update preserves arrival. Cancel + reinsert gets a new arrival and a fresh version.</text></g>
<text x="38" y="615" font-size="17">Indexed repair must update both job-to-slot mappings after every swap. Lazy records may outnumber live jobs.</text>
</g></svg>
