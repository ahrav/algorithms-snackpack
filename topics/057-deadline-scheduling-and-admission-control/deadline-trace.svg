<text x="571.5" y="143" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334963" text-anchor="middle">idle</text>
<text x="630" y="144" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14253c" text-anchor="start">Both finish on time</text>
<text x="30" y="186" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14253c" text-anchor="start">Shortest period</text>
