<text x="571.5" y="185" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#334963" text-anchor="middle">idle</text>
<text x="630" y="186" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9a301a" text-anchor="start">B misses at 3</text>
<text x="30" y="228" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#14253c" text-anchor="start">Tighten A’s deadline to 3. Four ticks of work are due by tick 3.</text>
<path d="M30 250H1010" stroke="#bccbdf"/>
<text x="30" y="286" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14253c" text-anchor="start">Now give B 5 ticks of work and a server budget of 2 every 7.</text>
