<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="465" viewBox="0 0 1040 465">
<rect width="1040" height="465" fill="#f8fafc"/>
<text x="30" y="41" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#14253c" text-anchor="start">Deadline order and budget exhaustion</text>
<text x="30" y="75" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#14253c" text-anchor="start">At time 0, A needs 2 ticks by 5. B needs 2 ticks by 3.</text>
