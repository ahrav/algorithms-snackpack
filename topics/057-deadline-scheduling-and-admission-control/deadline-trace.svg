<text x="310" y="111" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#334963" text-anchor="middle">1</text>
<text x="385" y="111" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#334963" text-anchor="middle">2</text>
<text x="460" y="111" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#334963" text-anchor="middle">3</text>
<text x="535" y="111" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#334963" text-anchor="middle">4</text>
