<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510">
<rect width="1200" height="510" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="30" y="40" font-size="27">Equality join: preserve duplicates through partition and probe</text>
<rect x="30" y="75" width="370" height="270" rx="8" fill="white" stroke="#64748b" stroke-width="2"/><text x="46" y="112" font-size="21" font-weight="bold">BEFORE: two inputs</text><text x="46" y="160" font-size="19">Build L = [2, 2, 4, 7]</text><text x="46" y="208" font-size="19">Probe R = [2, 2, 2, 4, 8]</text><text x="46" y="256" font-size="19">Each occurrence is a row.</text><text x="46" y="304" font-size="19">Goal: count equal-key pairs.</text><rect x="420" y="75" width="370" height="270" rx="8" fill="white" stroke="#64748b" stroke-width="2"/><text x="436" y="112" font-size="21" font-weight="bold">DURING: same parity route</text><text x="436" y="160" font-size="19">Even L = [2, 2, 4]</text><text x="436" y="208" font-size="19">Even R = [2, 2, 2, 4, 8]</text><text x="436" y="256" font-size="19">Odd L = [7]; Odd R = []</text><text x="436" y="304" font-size="19">Equal keys always meet.</text><rect x="810" y="75" width="370" height="270" rx="8" fill="white" stroke="#64748b" stroke-width="2"/><text x="826" y="112" font-size="21" font-weight="bold">AFTER: local frequencies</text><text x="826" y="160" font-size="19">Build counts: {2: 2, 4: 1}</text><text x="826" y="208" font-size="19">Probe 2 three times: 3 × 2 = 6</text><text x="826" y="256" font-size="19">Probe 4 once: 1 × 1 = 1</text><text x="826" y="304" font-size="19">Probe 8: 0; total pairs = 7</text><text x="30" y="392" font-size="21">Read left to right. Parity is a teaching route; the runnable code mixes keys before routing.</text>
<text x="30" y="432" font-size="21">Budget 2 rows: the 3-row even build is oversized. A repeated key cannot be split by hashing.</text>
<text x="30" y="472" font-size="21">Use new hash bits with progress checks, then a bounded chunk/rescan fallback when needed.</text>
</g></svg>