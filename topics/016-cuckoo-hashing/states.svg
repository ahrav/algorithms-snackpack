<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect width="1080" height="660" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#15253d"><text x="28" y="38" font-size="24" font-weight="bold">Cuckoo insertion: find a vacancy, then move backward</text><text x="28" y="68" font-size="17">Two banks, four one-slot buckets each. A:(0,1), B:(0,0), C:(1,1), D:(0,0).</text><text x="28" y="114" font-size="19" font-weight="bold">BEFORE: insert D</text><text x="28" y="142" font-size="17">Bank 0</text><rect x="28" y="154" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="38" y="175" font-size="16">bucket 0</text><text x="143" y="175" font-size="16">A</text><rect x="28" y="186" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="38" y="207" font-size="16">bucket 1</text><text x="143" y="207" font-size="16">C</text><rect x="28" y="218" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="38" y="239" font-size="16">bucket 2</text><text x="143" y="239" font-size="16">empty</text><rect x="28" y="250" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="38" y="271" font-size="16">bucket 3</text><text x="143" y="271" font-size="16">empty</text><text x="28" y="316" font-size="17">Bank 1</text><rect x="28" y="328" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="38" y="349" font-size="16">bucket 0</text><text x="143" y="349" font-size="16">B</text><rect x="28" y="360" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="38" y="381" font-size="16">bucket 1</text><text x="143" y="381" font-size="16">empty</text><rect x="28" y="392" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="38" y="413" font-size="16">bucket 2</text><text x="143" y="413" font-size="16">empty</text><rect x="28" y="424" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="38" y="445" font-size="16">bucket 3</text><text x="143" y="445" font-size="16">empty</text><text x="380" y="114" font-size="19" font-weight="bold">PLAN: no writes yet</text><text x="380" y="142" font-size="17">Bank 0</text><rect x="380" y="154" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="390" y="175" font-size="16">bucket 0</text><text x="495" y="175" font-size="16">A → right1</text><rect x="380" y="186" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="390" y="207" font-size="16">bucket 1</text><text x="495" y="207" font-size="16">C</text><rect x="380" y="218" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="390" y="239" font-size="16">bucket 2</text><text x="495" y="239" font-size="16">empty</text><rect x="380" y="250" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="390" y="271" font-size="16">bucket 3</text><text x="495" y="271" font-size="16">empty</text><text x="380" y="316" font-size="17">Bank 1</text><rect x="380" y="328" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="390" y="349" font-size="16">bucket 0</text><text x="495" y="349" font-size="16">B</text><rect x="380" y="360" width="310" height="30" fill="#e2f2e8" stroke="#60728a"/><text x="390" y="381" font-size="16">bucket 1</text><text x="495" y="381" font-size="16">vacancy</text><rect x="380" y="392" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="390" y="413" font-size="16">bucket 2</text><text x="495" y="413" font-size="16">empty</text><rect x="380" y="424" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="390" y="445" font-size="16">bucket 3</text><text x="495" y="445" font-size="16">empty</text><text x="732" y="114" font-size="19" font-weight="bold">AFTER: D is resident</text><text x="732" y="142" font-size="17">Bank 0</text><rect x="732" y="154" width="310" height="30" fill="#e2f2e8" stroke="#60728a"/><text x="742" y="175" font-size="16">bucket 0</text><text x="847" y="175" font-size="16">D</text><rect x="732" y="186" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="742" y="207" font-size="16">bucket 1</text><text x="847" y="207" font-size="16">C</text><rect x="732" y="218" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="742" y="239" font-size="16">bucket 2</text><text x="847" y="239" font-size="16">empty</text><rect x="732" y="250" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="742" y="271" font-size="16">bucket 3</text><text x="847" y="271" font-size="16">empty</text><text x="732" y="316" font-size="17">Bank 1</text><rect x="732" y="328" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="742" y="349" font-size="16">bucket 0</text><text x="847" y="349" font-size="16">B</text><rect x="732" y="360" width="310" height="30" fill="#e2f2e8" stroke="#60728a"/><text x="742" y="381" font-size="16">bucket 1</text><text x="847" y="381" font-size="16">A</text><rect x="732" y="392" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="742" y="413" font-size="16">bucket 2</text><text x="847" y="413" font-size="16">empty</text><rect x="732" y="424" width="310" height="30" fill="#edf1f7" stroke="#60728a"/><text x="742" y="445" font-size="16">bucket 3</text><text x="847" y="445" font-size="16">empty</text><text x="28" y="515" font-size="18" font-weight="bold">Commit order: move A to bank1/bucket1; write D to bank0/bucket0.</text><text x="28" y="552" font-size="18">FAILURE WITNESS: E:(0,0) competes with B and D for only two cells.</text><text x="28" y="584" font-size="18">Three exact keys cannot occupy two one-slot cells. Four global vacancies do not help.</text><text x="28" y="622" font-size="18">On rejection, B and D retain their values, A and C stay reachable, and E is returned.</text></g></svg>