<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" width="1020" height="360" role="img" aria-labelledby="title desc">
<title id="title">How adjacent pooling fits four ordered readings</title>
<desc id="desc">The four readings are 6, 2, 3, 8. Pool the first two to mean 4, then pool the first three to mean 11 over 3. The final point stays at 8.</desc>
<rect width="1020" height="360" fill="#f4f7fa"/>
<text x="30" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#142938">Fit a nondecreasing sequence in the original bucket order</text>
<g font-family="sans-serif" fill="#142938">
<rect x="30" y="66" width="304" height="248" rx="9" fill="white" stroke="#a7b8c6"/>
<rect x="358" y="66" width="304" height="248" rx="9" fill="white" stroke="#a7b8c6"/>
<rect x="686" y="66" width="304" height="248" rx="9" fill="white" stroke="#a7b8c6"/>
<g font-size="19" font-weight="700">
<text x="49" y="100">Before · Four singleton blocks</text>
<text x="377" y="100">During · First merge</text>
<text x="705" y="100">After · Final fit</text>
</g>
<g font-size="16" font-weight="600" text-anchor="middle">
<text x="82" y="144">1</text><text x="149" y="144">2</text><text x="216" y="144">3</text><text x="283" y="144">4</text>
<text x="410" y="144">1</text><text x="477" y="144">2</text><text x="544" y="144">3</text><text x="611" y="144">4</text>
<text x="738" y="144">1</text><text x="805" y="144">2</text><text x="872" y="144">3</text><text x="939" y="144">4</text>
</g>
<g fill="#e4edf4" stroke="#7895aa">
<rect x="54" y="158" width="56" height="54" rx="5"/><rect x="121" y="158" width="56" height="54" rx="5"/>
<rect x="188" y="158" width="56" height="54" rx="5"/><rect x="255" y="158" width="56" height="54" rx="5"/>
<rect x="516" y="158" width="56" height="54" rx="5"/><rect x="583" y="158" width="56" height="54" rx="5"/>
<rect x="911" y="158" width="56" height="54" rx="5"/>
</g>
<g stroke="#146658" fill="#d3eee7">
<rect x="382" y="158" width="123" height="54" rx="5"/>
<rect x="710" y="158" width="190" height="54" rx="5"/>
</g>
<g font-size="22" font-weight="700" text-anchor="middle">
<text x="82" y="192">6</text><text x="149" y="192">2</text><text x="216" y="192">3</text><text x="283" y="192">8</text>
<text x="443" y="192">4</text><text x="544" y="192">3</text><text x="611" y="192">8</text>
<text x="805" y="192">11/3</text><text x="939" y="192">8</text>
</g>
<g font-size="16">
<text x="50" y="254">6 &gt; 2 violates the order.</text>
<text x="378" y="254">(6 + 2) / 2 = 4</text>
<text x="378" y="281">4 &gt; 3 still violates the order.</text>
<text x="706" y="254">(6 + 2 + 3) / 3 = 11/3</text>
<text x="706" y="281">11/3 ≤ 8 satisfies the order.</text>
<text x="30" y="340">Numbers above boxes are bucket indices. Each box holds one fitted block mean.</text>
</g></g></svg>
