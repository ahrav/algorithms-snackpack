<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="470" viewBox="0 0 1020 470"><rect width="1020" height="470" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#15202b} .title{font-size:20px;font-weight:bold} .cell{font-size:16px} .small{font-size:15px}</style><text x="24" y="30" class="title">Lookup C with tag 0x5A: control bytes select candidates; equality selects the key</text><text x="24" y="70" class="title">Before: stored group</text><rect x="24" y="90" width="62" height="38" fill="#e7edf3" stroke="#263445"/><text x="32" y="115" class="cell">Lane</text><rect x="86" y="90" width="120" height="38" fill="#e7edf3" stroke="#263445"/><text x="94" y="115" class="cell">Control</text><rect x="206" y="90" width="128" height="38" fill="#e7edf3" stroke="#263445"/><text x="214" y="115" class="cell">Payload</text><rect x="24" y="128" width="62" height="38" fill="#fff" stroke="#263445"/><text x="32" y="153" class="cell">0</text><rect x="86" y="128" width="120" height="38" fill="#fff" stroke="#263445"/><text x="94" y="153" class="cell">0x5A</text><rect x="206" y="128" width="128" height="38" fill="#fff" stroke="#263445"/><text x="214" y="153" class="cell">A</text><rect x="24" y="166" width="62" height="38" fill="#fff" stroke="#263445"/><text x="32" y="191" class="cell">1</text><rect x="86" y="166" width="120" height="38" fill="#fff" stroke="#263445"/><text x="94" y="191" class="cell">0x17</text><rect x="206" y="166" width="128" height="38" fill="#fff" stroke="#263445"/><text x="214" y="191" class="cell">B</text><rect x="24" y="204" width="62" height="38" fill="#fff" stroke="#263445"/><text x="32" y="229" class="cell">2</text><rect x="86" y="204" width="120" height="38" fill="#fff" stroke="#263445"/><text x="94" y="229" class="cell">DELETED</text><rect x="206" y="204" width="128" height="38" fill="#fff" stroke="#263445"/><text x="214" y="229" class="cell">-</text><rect x="24" y="242" width="62" height="38" fill="#fff" stroke="#263445"/><text x="32" y="267" class="cell">3</text><rect x="86" y="242" width="120" height="38" fill="#fff" stroke="#263445"/><text x="94" y="267" class="cell">0x5A</text><rect x="206" y="242" width="128" height="38" fill="#fff" stroke="#263445"/><text x="214" y="267" class="cell">C</text><rect x="24" y="280" width="62" height="38" fill="#fff" stroke="#263445"/><text x="32" y="305" class="cell">4</text><rect x="86" y="280" width="120" height="38" fill="#fff" stroke="#263445"/><text x="94" y="305" class="cell">EMPTY</text><rect x="206" y="280" width="128" height="38" fill="#fff" stroke="#263445"/><text x="214" y="305" class="cell">-</text><rect x="24" y="318" width="62" height="38" fill="#fff" stroke="#263445"/><text x="32" y="343" class="cell">5-15</text><rect x="86" y="318" width="120" height="38" fill="#fff" stroke="#263445"/><text x="94" y="343" class="cell">EMPTY</text><rect x="206" y="318" width="128" height="38" fill="#fff" stroke="#263445"/><text x="214" y="343" class="cell">-</text><text x="24" y="385" class="small">16 control lanes, separate payload.</text><text x="24" y="409" class="small">DELETED cannot stop probing.</text><text x="356" y="70" class="title">During: tag match mask</text><rect x="356" y="90" width="62" height="38" fill="#e7edf3" stroke="#263445"/><text x="364" y="115" class="cell">Lane</text><rect x="418" y="90" width="120" height="38" fill="#e7edf3" stroke="#263445"/><text x="426" y="115" class="cell">Control</text><rect x="538" y="90" width="128" height="38" fill="#e7edf3" stroke="#263445"/><text x="546" y="115" class="cell">Payload</text><rect x="356" y="128" width="62" height="38" fill="#cbeedc" stroke="#263445"/><text x="364" y="153" class="cell">0</text><rect x="418" y="128" width="120" height="38" fill="#cbeedc" stroke="#263445"/><text x="426" y="153" class="cell">0x5A</text><rect x="538" y="128" width="128" height="38" fill="#cbeedc" stroke="#263445"/><text x="546" y="153" class="cell">A</text><rect x="356" y="166" width="62" height="38" fill="#fff" stroke="#263445"/><text x="364" y="191" class="cell">1</text><rect x="418" y="166" width="120" height="38" fill="#fff" stroke="#263445"/><text x="426" y="191" class="cell">0x17</text><rect x="538" y="166" width="128" height="38" fill="#fff" stroke="#263445"/><text x="546" y="191" class="cell">B</text><rect x="356" y="204" width="62" height="38" fill="#fff" stroke="#263445"/><text x="364" y="229" class="cell">2</text><rect x="418" y="204" width="120" height="38" fill="#fff" stroke="#263445"/><text x="426" y="229" class="cell">DELETED</text><rect x="538" y="204" width="128" height="38" fill="#fff" stroke="#263445"/><text x="546" y="229" class="cell">-</text><rect x="356" y="242" width="62" height="38" fill="#cbeedc" stroke="#263445"/><text x="364" y="267" class="cell">3</text><rect x="418" y="242" width="120" height="38" fill="#cbeedc" stroke="#263445"/><text x="426" y="267" class="cell">0x5A</text><rect x="538" y="242" width="128" height="38" fill="#cbeedc" stroke="#263445"/><text x="546" y="267" class="cell">C</text><rect x="356" y="280" width="62" height="38" fill="#fff" stroke="#263445"/><text x="364" y="305" class="cell">4</text><rect x="418" y="280" width="120" height="38" fill="#fff" stroke="#263445"/><text x="426" y="305" class="cell">EMPTY</text><rect x="538" y="280" width="128" height="38" fill="#fff" stroke="#263445"/><text x="546" y="305" class="cell">-</text><rect x="356" y="318" width="62" height="38" fill="#fff" stroke="#263445"/><text x="364" y="343" class="cell">5-15</text><rect x="418" y="318" width="120" height="38" fill="#fff" stroke="#263445"/><text x="426" y="343" class="cell">EMPTY</text><rect x="538" y="318" width="128" height="38" fill="#fff" stroke="#263445"/><text x="546" y="343" class="cell">-</text><text x="356" y="385" class="small">Mask selects lanes 0 and 3.</text><text x="356" y="409" class="small">Reject all other payload reads.</text><text x="688" y="70" class="title">After: exact equality</text><rect x="688" y="90" width="62" height="38" fill="#e7edf3" stroke="#263445"/><text x="696" y="115" class="cell">Lane</text><rect x="750" y="90" width="120" height="38" fill="#e7edf3" stroke="#263445"/><text x="758" y="115" class="cell">Control</text><rect x="870" y="90" width="128" height="38" fill="#e7edf3" stroke="#263445"/><text x="878" y="115" class="cell">Payload</text><rect x="688" y="128" width="62" height="38" fill="#fff" stroke="#263445"/><text x="696" y="153" class="cell">0</text><rect x="750" y="128" width="120" height="38" fill="#fff" stroke="#263445"/><text x="758" y="153" class="cell">0x5A</text><rect x="870" y="128" width="128" height="38" fill="#fff" stroke="#263445"/><text x="878" y="153" class="cell">A</text><rect x="688" y="166" width="62" height="38" fill="#fff" stroke="#263445"/><text x="696" y="191" class="cell">1</text><rect x="750" y="166" width="120" height="38" fill="#fff" stroke="#263445"/><text x="758" y="191" class="cell">0x17</text><rect x="870" y="166" width="128" height="38" fill="#fff" stroke="#263445"/><text x="878" y="191" class="cell">B</text><rect x="688" y="204" width="62" height="38" fill="#fff" stroke="#263445"/><text x="696" y="229" class="cell">2</text><rect x="750" y="204" width="120" height="38" fill="#fff" stroke="#263445"/><text x="758" y="229" class="cell">DELETED</text><rect x="870" y="204" width="128" height="38" fill="#fff" stroke="#263445"/><text x="878" y="229" class="cell">-</text><rect x="688" y="242" width="62" height="38" fill="#cbeedc" stroke="#263445"/><text x="696" y="267" class="cell">3</text><rect x="750" y="242" width="120" height="38" fill="#cbeedc" stroke="#263445"/><text x="758" y="267" class="cell">0x5A</text><rect x="870" y="242" width="128" height="38" fill="#cbeedc" stroke="#263445"/><text x="878" y="267" class="cell">C</text><rect x="688" y="280" width="62" height="38" fill="#fff" stroke="#263445"/><text x="696" y="305" class="cell">4</text><rect x="750" y="280" width="120" height="38" fill="#fff" stroke="#263445"/><text x="758" y="305" class="cell">EMPTY</text><rect x="870" y="280" width="128" height="38" fill="#fff" stroke="#263445"/><text x="878" y="305" class="cell">-</text><rect x="688" y="318" width="62" height="38" fill="#fff" stroke="#263445"/><text x="696" y="343" class="cell">5-15</text><rect x="750" y="318" width="120" height="38" fill="#fff" stroke="#263445"/><text x="758" y="343" class="cell">EMPTY</text><rect x="870" y="318" width="128" height="38" fill="#fff" stroke="#263445"/><text x="878" y="343" class="cell">-</text><text x="688" y="385" class="small">Lane 0: A != C. Lane 3: C == C.</text><text x="688" y="409" class="small">Return C; same tag never proves equality.</text><text x="24" y="449" class="small">For a miss, check every selected candidate, then stop at a true EMPTY. Green is also identified by text.</text></svg>