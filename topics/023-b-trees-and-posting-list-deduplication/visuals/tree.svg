<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590">
<rect width="1080" height="590" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#172537;font-size:18px}.title{font-size:24px;font-weight:bold}.head{font-size:20px;font-weight:bold}.box{fill:#eef3f8;stroke:#294e70;stroke-width:2}.mono{font-family:monospace;font-size:19px;white-space:pre}</style>
<text x="28" y="36" class="title">Keep row identity while grouping keys and splitting leaves</text>
<text x="28" y="70">Illustrative leaf limit: 3 distinct keys. This is a slot model, not a database byte page.</text>
<rect x="28" y="92" width="315" height="330" rx="8" class="box"/>
<text x="44" y="123" class="head">1. Before: 5 pairs, 3 keys</text>
<text x="44" y="160" class="mono">(7,10) (7,12) (7,15)</text>
<text x="44" y="191" class="mono">(9,20) (11,21)</text>
<text x="44" y="237">Store each key once:</text>
<text x="44" y="276" class="mono">7  → [10,12,15]</text>
<text x="44" y="309" class="mono">9  → [20]</text>
<text x="44" y="342" class="mono">11 → [21]</text>
<text x="44" y="391">One full leaf; all 5 rows remain.</text>
<rect x="362" y="92" width="315" height="330" rx="8" class="box"/>
<text x="378" y="123" class="head">2. During: insert (13,22)</text>
<text x="378" y="169" class="mono">7  → [10,12,15]</text>
<text x="378" y="202" class="mono">9  → [20]</text>
<text x="378" y="235" class="mono">11 → [21]</text>
<text x="378" y="268" class="mono">13 → [22]  NEW</text>
<text x="378" y="320">Four distinct keys exceed 3 slots.</text>
<text x="378" y="354">Split by key groups.</text>
<text x="378" y="391">Never discard a row to make room.</text>
<rect x="696" y="92" width="356" height="330" rx="8" class="box"/>
<text x="712" y="123" class="head">3. After: 6 pairs, 4 keys</text>
<rect x="820" y="145" width="105" height="42" fill="#fff" stroke="#294e70" stroke-width="2"/>
<text x="833" y="173">root: 11</text>
<path d="M840 187 L784 221 M905 187 L963 221" fill="none" stroke="#294e70" stroke-width="2"/>
<rect x="709" y="225" width="179" height="125" fill="#fff" stroke="#294e70" stroke-width="2"/>
<rect x="904" y="225" width="135" height="125" fill="#fff" stroke="#294e70" stroke-width="2"/>
<text x="719" y="254">left: key &lt; 11</text><text x="719" y="291" class="mono">7:[10,12,15]</text><text x="719" y="324" class="mono">9:[20]</text>
<text x="914" y="254">right: ≥ 11</text><text x="914" y="291" class="mono">11:[21]</text><text x="914" y="324" class="mono">13:[22]</text>
<text x="712" y="391">Separator routes; leaves own the rows.</text>
<text x="28" y="465">Lookup 7: follow left, then emit row IDs 10, 12 and 15. Lookup 13: follow right, then emit 22.</text>
<text x="28" y="502">Range [7,12): visit leaves in order and emit (7,10), (7,12), (7,15), (9,20), (11,21).</text>
<text x="28" y="539">Invariant: expanding every posting exactly reconstructs the ordered unique pair set.</text>
<text x="28" y="571">The runnable packed directory uses maximum-key fences; the sketch uses a minimum-right separator.</text>
</svg>
