<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560"><title>Compressed radix insertion: split car at ca to add cab</title><rect width="1500" height="560" fill="#f5f7fb"/><style>text{font-family:Arial,sans-serif;fill:#14233b}.title{font-size:26px;font-weight:bold}.head{font-size:22px;font-weight:bold}.label{font-size:19px}.note{font-size:18px} .box{fill:#e1edff;stroke:#245b9e;stroke-width:2}.edge{stroke:#245b9e;stroke-width:3;fill:none}</style><text x="35" y="42" class="title">Insert cab = 40 without losing car = 10</text><rect x="20" y="65" width="470" height="455" rx="16" fill="white" stroke="#c7d1df"/><rect x="515" y="65" width="470" height="455" rx="16" fill="white" stroke="#c7d1df"/><rect x="1010" y="65" width="470" height="455" rx="16" fill="white" stroke="#c7d1df"/><text x="45" y="105" class="head">BEFORE: three keys</text><rect x="145" y="145" rx="10" width="180" height="48" class="box"/><text x="157" y="176" class="label">car  [value 10]</text><path d="M190 193 L120 265" class="edge"/><path d="M280 193 L355 265" class="edge"/><rect x="65" y="265" rx="10" width="140" height="48" class="box"/><text x="77" y="296" class="label">bon  [30]</text><rect x="300" y="265" rx="10" width="130" height="48" class="box"/><text x="312" y="296" class="label">t  [20]</text><text x="45" y="382" class="note">A terminal may also have children.</text><text x="45" y="420" class="note">carbon and cart share the car path.</text><text x="540" y="105" class="head">DURING: first mismatch</text><rect x="645" y="145" rx="10" width="180" height="48" class="box"/><text x="657" y="176" class="label">ca  [no value]</text><path d="M680 193 L605 265" class="edge"/><path d="M780 193 L870 265" class="edge"/><rect x="555" y="265" rx="10" width="140" height="48" class="box"/><text x="567" y="296" class="label">b  [40]</text><rect x="795" y="265" rx="10" width="140" height="48" class="box"/><text x="807" y="296" class="label">r  [10]</text><text x="540" y="382" class="note">cab differs from car at byte 3.</text><text x="540" y="420" class="note">Keep ca; move r under a new branch.</text><text x="540" y="458" class="note">An unfinished key is not an exact hit.</text><text x="1035" y="105" class="head">AFTER: four keys</text><rect x="1140" y="145" rx="10" width="180" height="48" class="box"/><text x="1152" y="176" class="label">ca  [no value]</text><path d="M1170 193 L1090 265" class="edge"/><path d="M1270 193 L1330 265" class="edge"/><rect x="1040" y="265" rx="10" width="130" height="48" class="box"/><text x="1052" y="296" class="label">b  [40]</text><rect x="1260" y="265" rx="10" width="150" height="48" class="box"/><text x="1272" y="296" class="label">r  [value 10]</text><path d="M1300 313 L1230 375" class="edge"/><path d="M1370 313 L1410 375" class="edge"/><rect x="1160" y="375" rx="10" width="140" height="48" class="box"/><text x="1172" y="406" class="label">bon  [30]</text><rect x="1340" y="375" rx="10" width="130" height="48" class="box"/><text x="1352" y="406" class="label">t  [20]</text><text x="1035" y="470" class="note">Prefix ca emits 40, 10, 30, 20 in order.</text><text x="35" y="548" class="note">Boxes store compressed suffixes. Values mark complete keys. Edges consume the next byte; this sketch combines edge + child suffix.</text></svg>