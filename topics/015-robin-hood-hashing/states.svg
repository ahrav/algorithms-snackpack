<text x="32" y="257" fill="#155e75" font-family="Arial,sans-serif" font-size="16">C distance 1 > B distance 0. Carry B onward.</text>
<text x="32" y="339" fill="#152538" font-family="Arial,sans-serif" font-size="19">AFTER: displaced B advances one slot</text>
