<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="590" viewBox="0 0 1180 590"><rect width="1180" height="590" fill="#f8fafc"/>
<text x="32" y="40" fill="#152538" font-family="Arial,sans-serif" font-size="26">Robin Hood insertion: give the slot to the key farther from home</text>
<text x="32" y="115" fill="#152538" font-family="Arial,sans-serif" font-size="19">BEFORE: insert C (home 0)</text>
