<text x="994" y="131" fill="#152538" font-family="Arial,sans-serif" font-size="17">EMPTY</text>
<text x="32" y="227" fill="#152538" font-family="Arial,sans-serif" font-size="19">DURING: C at slot 1 takes B’s place</text>
