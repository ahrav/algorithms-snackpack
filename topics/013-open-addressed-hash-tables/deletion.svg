<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460"><rect width="1180" height="460" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="26" y="36" font-size="23" font-weight="bold">Deletion must preserve the path from home to key</text><text x="26" y="66" font-size="17">Eight slots. Identity hash: home(1) = home(9) = home(17) = 1. Values omitted.</text><text x="26" y="128" font-size="17">Before: insert 1, 9, 17</text><rect x="300" y="100" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="349" y="118" text-anchor="middle" font-size="13">slot 0</text><text x="349" y="141" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="404" y="100" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="453" y="118" text-anchor="middle" font-size="13">slot 1</text><text x="453" y="141" text-anchor="middle" font-size="14" font-weight="bold">1</text><rect x="508" y="100" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="557" y="118" text-anchor="middle" font-size="13">slot 2</text><text x="557" y="141" text-anchor="middle" font-size="14" font-weight="bold">9</text><rect x="612" y="100" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="661" y="118" text-anchor="middle" font-size="13">slot 3</text><text x="661" y="141" text-anchor="middle" font-size="14" font-weight="bold">17</text><rect x="716" y="100" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="765" y="118" text-anchor="middle" font-size="13">slot 4</text><text x="765" y="141" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="820" y="100" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="869" y="118" text-anchor="middle" font-size="13">slot 5</text><text x="869" y="141" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="924" y="100" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="973" y="118" text-anchor="middle" font-size="13">slot 6</text><text x="973" y="141" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="1028" y="100" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="1077" y="118" text-anchor="middle" font-size="13">slot 7</text><text x="1077" y="141" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><text x="26" y="203" font-size="17">During: remove 9 (lazy)</text><rect x="300" y="175" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="349" y="193" text-anchor="middle" font-size="13">slot 0</text><text x="349" y="216" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="404" y="175" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="453" y="193" text-anchor="middle" font-size="13">slot 1</text><text x="453" y="216" text-anchor="middle" font-size="14" font-weight="bold">1</text><rect x="508" y="175" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="557" y="193" text-anchor="middle" font-size="13">slot 2</text><text x="557" y="216" text-anchor="middle" font-size="14" font-weight="bold">Deleted</text><rect x="612" y="175" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="661" y="193" text-anchor="middle" font-size="13">slot 3</text><text x="661" y="216" text-anchor="middle" font-size="14" font-weight="bold">17</text><rect x="716" y="175" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="765" y="193" text-anchor="middle" font-size="13">slot 4</text><text x="765" y="216" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="820" y="175" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="869" y="193" text-anchor="middle" font-size="13">slot 5</text><text x="869" y="216" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="924" y="175" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="973" y="193" text-anchor="middle" font-size="13">slot 6</text><text x="973" y="216" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="1028" y="175" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="1077" y="193" text-anchor="middle" font-size="13">slot 7</text><text x="1077" y="216" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><text x="26" y="278" font-size="17">After: lookup 17</text><rect x="300" y="250" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="349" y="268" text-anchor="middle" font-size="13">slot 0</text><text x="349" y="291" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="404" y="250" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="453" y="268" text-anchor="middle" font-size="13">slot 1</text><text x="453" y="291" text-anchor="middle" font-size="14" font-weight="bold">1</text><rect x="508" y="250" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="557" y="268" text-anchor="middle" font-size="13">slot 2</text><text x="557" y="291" text-anchor="middle" font-size="14" font-weight="bold">Continue</text><rect x="612" y="250" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="661" y="268" text-anchor="middle" font-size="13">slot 3</text><text x="661" y="291" text-anchor="middle" font-size="14" font-weight="bold">FOUND 17</text><rect x="716" y="250" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="765" y="268" text-anchor="middle" font-size="13">slot 4</text><text x="765" y="291" text-anchor="middle" font-size="14" font-weight="bold">Stop if miss</text><rect x="820" y="250" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="869" y="268" text-anchor="middle" font-size="13">slot 5</text><text x="869" y="291" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="924" y="250" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="973" y="268" text-anchor="middle" font-size="13">slot 6</text><text x="973" y="291" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="1028" y="250" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="1077" y="268" text-anchor="middle" font-size="13">slot 7</text><text x="1077" y="291" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><text x="26" y="353" font-size="17">After: backward shift</text><rect x="300" y="325" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="349" y="343" text-anchor="middle" font-size="13">slot 0</text><text x="349" y="366" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="404" y="325" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="453" y="343" text-anchor="middle" font-size="13">slot 1</text><text x="453" y="366" text-anchor="middle" font-size="14" font-weight="bold">1</text><rect x="508" y="325" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="557" y="343" text-anchor="middle" font-size="13">slot 2</text><text x="557" y="366" text-anchor="middle" font-size="14" font-weight="bold">17</text><rect x="612" y="325" width="98" height="57" rx="3" fill="#eef4fb" stroke="#34445c"/><text x="661" y="343" text-anchor="middle" font-size="13">slot 3</text><text x="661" y="366" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="716" y="325" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="765" y="343" text-anchor="middle" font-size="13">slot 4</text><text x="765" y="366" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="820" y="325" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="869" y="343" text-anchor="middle" font-size="13">slot 5</text><text x="869" y="366" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="924" y="325" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="973" y="343" text-anchor="middle" font-size="13">slot 6</text><text x="973" y="366" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><rect x="1028" y="325" width="98" height="57" rx="3" fill="#ffffff" stroke="#34445c"/><text x="1077" y="343" text-anchor="middle" font-size="13">slot 7</text><text x="1077" y="366" text-anchor="middle" font-size="14" font-weight="bold">Empty</text><text x="26" y="421" font-size="17">Read left to right from slot 1. Deleted means keep searching; Empty proves absence.</text><text x="26" y="447" font-size="17">Shift moves 17 from slot 3 to slot 2 because its probe path crosses the hole.</text></g></svg>