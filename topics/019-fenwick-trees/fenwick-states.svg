<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690">
<rect width="1160" height="690" fill="#f8fafc"/>
<text x="25" y="37" font-family="Arial, sans-serif" font-size="25" fill="#0f172a" font-weight="bold">Fenwick trees: one update repairs only the buckets that contain it</text>
<text x="25" y="66" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">Public indices are zero-based. Bucket indices are one-based. All intervals are half-open.</text>
<rect x="25" y="90" width="355" height="545" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="39" y="121" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="bold">BEFORE: stored bucket sums</text>
<rect x="410" y="90" width="355" height="545" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="424" y="121" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="bold">DURING: add(3, +6)</text>
<rect x="795" y="90" width="355" height="545" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="809" y="121" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="bold">AFTER: prefix(7)</text>
<text x="43" y="153" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="bold">i</text>
<text x="95" y="153" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="bold">interval</text>
<text x="230" y="153" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="bold">T[i]</text>
<text x="43" y="184" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">1</text>
<text x="95" y="184" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">[0, 1)</text>
<text x="230" y="184" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">3</text>
<text x="43" y="218" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">2</text>
<text x="95" y="218" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">[0, 2)</text>
<text x="230" y="218" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">4</text>
<text x="43" y="252" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">3</text>
<text x="95" y="252" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">[2, 3)</text>
<text x="230" y="252" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">4</text>
<rect x="35" y="263" width="334" height="29" rx="8" fill="#dbeafe" stroke="#94a3b8"/>
<text x="43" y="286" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">4</text>
<text x="95" y="286" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">[0, 4)</text>
<text x="230" y="286" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">8</text>
<text x="43" y="320" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">5</text>
<text x="95" y="320" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">[4, 5)</text>
<text x="230" y="320" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">2</text>
<text x="43" y="354" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">6</text>
<text x="95" y="354" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">[4, 6)</text>
<text x="230" y="354" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">7</text>
<text x="43" y="388" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">7</text>
<text x="95" y="388" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">[6, 7)</text>
<text x="230" y="388" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">0</text>
<rect x="35" y="399" width="334" height="29" rx="8" fill="#dbeafe" stroke="#94a3b8"/>
<text x="43" y="422" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">8</text>
<text x="95" y="422" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">[0, 8)</text>
<text x="230" y="422" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">16</text>
<text x="40" y="490" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">a = [3, 1, 4, 0, 2, 5, 0, 1]</text>
<text x="40" y="526" font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="normal">T[i] stores [i - lowbit(i), i).</text>
<text x="40" y="557" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">Blue buckets contain a[3].</text>
<text x="425" y="162" font-family="Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="bold">a[3]: 0 → 6</text>
<text x="425" y="215" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">Start at i = 3 + 1 = 4</text>
<text x="425" y="260" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">T[4]: 8 + 6 = 14</text>
<text x="425" y="305" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">i += lowbit(4): 4 → 8</text>
<text x="425" y="350" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">T[8]: 16 + 6 = 22</text>
<text x="425" y="395" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">i += lowbit(8): 8 → 16</text>
<text x="425" y="440" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">16 exceeds n = 8. Stop.</text>
<text x="425" y="506" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="bold">Changed array:</text>
<text x="425" y="538" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">[3, 1, 4, 6, 2, 5, 0, 1]</text>
<text x="425" y="578" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">Only T[4] and T[8] change.</text>
<text x="810" y="163" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">7: [6, 7) contributes 0</text>
<text x="810" y="214" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">6: [4, 6) contributes 7</text>
<text x="810" y="265" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">4: [0, 4) contributes 14</text>
<text x="810" y="316" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">0: stop</text>
<text x="810" y="378" font-family="Arial, sans-serif" font-size="19" fill="#0f172a" font-weight="normal">0 + 7 + 14 = 21</text>
<text x="810" y="431" font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="normal">Clear the lowest set bit each step.</text>
<text x="810" y="484" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="bold">For exact nonnegative counts:</text>
<text x="810" y="520" font-family="Arial, sans-serif" font-size="17" fill="#0f172a" font-weight="normal">zero-based rank 8 selects index 3.</text>
<text x="810" y="553" font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="normal">prefix(3) = 8 ≤ 8 &lt; 14 = prefix(4)</text>
<text x="25" y="670" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="bold">Selection requires monotone exact prefixes. Modular sums and signed weights do not satisfy that contract.</text>
</svg>