<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420"><rect width="1120" height="420" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#13243b} .title{font-size:23px;font-weight:bold}.head{font-size:18px;font-weight:bold}.body{font-size:17px}.small{font-size:15px}.box{fill:#e1edff;stroke:#245cb1;stroke-width:2}.line{stroke:#245cb1;stroke-width:2;fill:none}</style><text x="28" y="36" class="title">Same dictionary, fewer distinct future computations</text><path d="M372 65V360M742 65V360" stroke="#aab8cd"/><text x="28" y="82" class="head">BEFORE: values only at leaves</text><text x="28" y="118" class="body">bat → 10     bats → 12</text><text x="28" y="148" class="body">cat → 20     cats → 22</text><text x="28" y="197" class="body">After b: {at:10, ats:12}</text><text x="28" y="229" class="body">After c: {at:20, ats:22}</text><text x="28" y="282" class="small">Same suffix language, different outputs.</text><text x="28" y="310" class="small">Merging by language would lose values.</text><text x="396" y="82" class="head">DURING: factor common output</text><text x="396" y="130" class="body">Emit 10 on b, emit 20 on c.</text><text x="396" y="180" class="body">Both residual maps become:</text><rect x="411" y="201" width="290" height="64" rx="8" class="box"/><text x="435" y="240" class="body">{at:0, ats:2}</text><text x="396" y="310" class="small">Compare finality, final output,</text><text x="396" y="336" class="small">and every labeled residual arc.</text><text x="766" y="82" class="head">AFTER: share the residual state</text><rect x="780" y="114" width="70" height="44" rx="8" class="box"/><text x="793" y="143" class="body">root</text><rect x="946" y="190" width="110" height="50" rx="8" class="box"/><text x="965" y="220" class="body">{at,ats}</text><path d="M850 125 L995 190M830 158 L946 219" class="line"/><text x="898" y="136" class="body">b / 10</text><text x="811" y="202" class="body">c / 20</text><text x="766" y="282" class="body">cat: 20 + 0 = 20</text><text x="766" y="314" class="body">cats: 20 + 2 = 22</text><text x="28" y="390" class="small">Arc labels: input byte / emitted integer. Diagram folds the shared a,t,s paths into one labeled residual state.</text></svg>