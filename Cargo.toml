[package]
name = "algorithms-snackpack-catalog"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[workspace]
members = []
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
