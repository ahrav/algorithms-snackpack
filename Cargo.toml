[package]
name = "algorithms-snackpack-catalog"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[workspace]
members = [
    "topics/023-b-trees-and-posting-list-deduplication",
    "topics/022-skip-lists-and-hybrid-indexes",
    "topics/021-heaps-and-priority-queues",
    "topics/020-segment-trees-and-lazy-propagation",
    "topics/019-fenwick-trees",
    "topics/018-hash-joins-partitioning-and-spill",
    "topics/017-probabilistic-membership-filters",
    "topics/016-cuckoo-hashing",
    "topics/015-robin-hood-hashing",
    "topics/014-swisstable-metadata-filtering",
    "topics/013-open-addressed-hash-tables",
    "topics/011-merge-algorithms-and-duplicate-runs",
    "topics/012-radix-partitioning",
    "topics/009-reservoir-and-weighted-sampling",
    "topics/010-sorting-algorithm-portfolios",
    "topics/001-prefix-sums-and-scans",
    "topics/002-difference-arrays-and-range-updates",
    "topics/003-density-adaptive-bitmaps",
    "topics/004-interval-sets-and-compressed-ranges",
    "topics/005-two-pointers-and-sliding-windows",
    "topics/006-monotonic-stacks-and-deques",
    "topics/007-binary-galloping-branch-aware-search",
    "topics/008-selection-quickselect-top-k",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
